name: iOS build, Simulator & TestFlight deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-and-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: "M76828BXT2"
      BUNDLE_ID: "org.mdsystem.mdfp"
      DUNS_NUMBER: "667676387"
      PROFILE_UUID: "012167f5-464f-4fb1-bc43-9a984ca36c35"
      PROFILE_NAME: "MD Free People AppStore"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK (3.24.5)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.24.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Scaffold iOS Xcode project & inject native Swift modules
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter config --no-analytics

          cp ios/Runner/AppDelegate.swift "$RUNNER_TEMP/AppDelegate.swift"
          rm -rf ios
          flutter create --platforms=ios --org org.mdsystem --project-name mdfp_app .
          rm -f test/widget_test.dart
          git checkout -- lib test pubspec.yaml
          cp "$RUNNER_TEMP/AppDelegate.swift" ios/Runner/AppDelegate.swift

          cat > ios/Flutter/Debug.xcconfig << 'EOF'
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          #include "Generated.xcconfig"
          EOF

          cat > ios/Flutter/Release.xcconfig << 'EOF'
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          EOF

          # Set exact Bundle ID (org.mdsystem.mdfp), Team ID (M76828BXT2), and iOS 13.0 minimum deployment target
          sed -i '' 's/org\.mdsystem\.mdfpApp/org.mdsystem.mdfp/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # Inject Info.plist privacy descriptions & Export Compliance flag for App Store / TestFlight
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'MD Free People'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'MD Free People'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'MD Free People'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'MD Free People uses the camera exclusively for in-app capture of cryptographically signed photo and video evidence (MDFP1).'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'MD Free People uses the microphone to record audio for in-app video and voice evidence capture (MDFP1).'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'MD Free People optionally attaches GPS coordinates (microdegrees) to captured evidence records when permitted by the user.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'MD Free People optionally attaches GPS coordinates (microdegrees) to captured evidence records when permitted by the user.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Configure Podfile (iOS 13.0 + permission_handler macros) & generate opaque AppIcons
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter precache --ios

          cat > ios/Podfile << 'EOF'
          platform :ios, '13.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'i386'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= [
                  '$(inherited)',
                  'PERMISSION_CAMERA=1',
                  'PERMISSION_MICROPHONE=1',
                  'PERMISSION_LOCATION=1',
                  'PERMISSION_LOCATION_WHENINUSE=1',
                ]
              end
            end
          end
          EOF

          (cd ios && pod install)

          # Convert logo.png through opaque 24-bit JPEG first so App Store Connect never rejects icons for alpha channel
          sips -s format jpeg -s formatOptions 100 "assets/images/logo.png" --out "$RUNNER_TEMP/logo_opaque.jpg" >/dev/null
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          for f in "$ICON_DIR"/*.png; do
            [ -e "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth:/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight:/{print $2}')
            sips -s format png -z "$H" "$W" "$RUNNER_TEMP/logo_opaque.jpg" --out "$f" >/dev/null
          done

      - name: Build native iOS app for Simulator (Xcode + Swift SecureEnclave/Keychain + CocoaPods)
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --simulator --no-pub
          ls -la build/ios/iphonesimulator/Runner.app

      - name: Boot iPhone Simulator, install & verify live iOS app execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts_out

          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = []
          for runtime, devs in data.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          candidates.append((runtime, d['name'], d['udid']))
          candidates.sort(reverse=True)
          if not candidates:
              sys.exit(1)
          print(candidates[0][2])
          ")
          echo "Selected iPhone Simulator UDID: $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$UDID" grant all "$BUNDLE_ID" || true

          LAUNCH_OUT=$(xcrun simctl launch "$UDID" "$BUNDLE_ID")
          echo "Launched $BUNDLE_ID -> $LAUNCH_OUT"

          sleep 12

          xcrun simctl io "$UDID" screenshot artifacts_out/ios-simulator-onboarding.png
          sips -g pixelWidth -g pixelHeight artifacts_out/ios-simulator-onboarding.png

          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app artifacts_out/MD-Free-People-iOS-Simulator.app.zip
          ditto -c -k --sequesterRsrc --keepParent ios artifacts_out/ios-xcode-project.zip

          xcrun simctl shutdown "$UDID" || true

      - name: Build signed Release IPA & upload to Apple TestFlight
        if: ${{ secrets.IOS_DIST_P12_BASE64 != '' && secrets.ASC_KEY_ID != '' }}
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="TempKeychainPass2026!"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Pre-build Flutter AOT release assets
          flutter build ios --release --no-codesign --no-pub --build-number="${GITHUB_RUN_NUMBER}"

          # Archive with explicit Apple Distribution manual signing for Runner
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            FLUTTER_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa_out"

          cp "$RUNNER_TEMP"/ipa_out/*.ipa artifacts_out/MD-Free-People-1.0.3-TestFlight.ipa
          ls -lh artifacts_out/MD-Free-People-1.0.3-TestFlight.ipa

          echo "Uploading signed IPA to Apple TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            -f artifacts_out/MD-Free-People-1.0.3-TestFlight.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload iOS Simulator screenshot, signed .ipa, .app bundle, and Xcode project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdfp-ios-release-${{ github.run_number }}
          path: artifacts_out/*
          if-no-files-found: error
          retention-days: 30
