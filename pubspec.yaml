name: mdfp_app
description: "MD Free People (MD Вільні люди) - Trustless Citizen Evidence Capture Application"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0

  # Hardware & Media Capture (Only camera/mic/location)
  camera: ^0.11.0
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  path_provider: ^2.1.3

  # Cryptography & Local Storage
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.2

  # Background Work
  workmanager: ^0.5.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
